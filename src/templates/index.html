<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CP2-SAM Web Application</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>Welcome to the CP2-SAM Web Application</h1>
        <p>Your one-stop solution for customer segmentation, sales forecasting, and market basket analysis.</p>
    </header>
    <main>
        <section>
            <h2>Choose an Analysis</h2>
            <form action="/run_models" method="post" enctype="multipart/form-data">
    <label for="analysis-type">Select Analysis Type:</label>
    <select id="analysis-type" name="analysis_type">
        <option value="random_forest">Customer Segmentation (Random Forest)</option>
        <option value="lstm">Sales Forecasting (LSTM)</option>
        <option value="apriori">Market Basket Analysis (Apriori)</option>
    </select>
    <br><br>
    <label for="data-file">Upload CSV Data File:</label>
    <input type="file" id="data-file" name="data_file" accept=".csv" required>
    <br><br>
    <button type="submit">Submit</button>
</form>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 CP2-SAM Web Application. All rights reserved.</p>
    </footer>
</body>
</html>
